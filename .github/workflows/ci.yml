name: ci

# Runs the local test tiers only. Never test:live or eval*: they call the
# paid Meta API with a key, and this workflow has no secrets.
# Unit tests run on every PR and push to main. The browser tiers are slow and timing-
# sensitive, so they run locally with the change (.agents/skills/test) and here only when
# started by hand (Actions → ci → Run workflow).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run. Pushes to main all finish, so
# every merge gets its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # AGENTS.md: Node 24 + npm for tests
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:e2e
